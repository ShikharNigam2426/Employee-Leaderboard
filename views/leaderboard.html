<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ROLE_TITLE}} Leaderboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="leaderboard" data-role="{{ROLE_SLUG}}">
    <!-- Top Dashboard Header -->
    <div class="dashboard-top-header">
      <div class="top-left">
        <h1 class="dashboard-title">Daily Dashboard</h1>
      </div>
      <div class="top-right">
        <span class="date-badge" id="currentDate">13 May 2026</span>
      </div>
    </div>

    <!-- Main leaderboard card -->
    <main class="page">
      <section class="card">
        <!-- Role Info Header -->
        <div class="role-info-header">
          <div class="role-title-group">
            <span class="role-icon">📊</span>
            <h2 class="role-title">{{ROLE_TAG}}</h2>
          </div>
          <div class="card-header-images">
            <div class="card-header-box">
              <img src="/pragati.png" alt="Pragati Logo" class="card-header-img" />
            </div>
          </div>
        </div>
        
        <div class="leaderboard-tools">
          <p class="scroll-note">Scroll to view all details</p>
          <label class="search-field">
            <span class="sr-only">Search employee name</span>
            <input id="leaderboardSearch" type="search" placeholder="🔍 Search employee name" />
          </label>
          <p id="searchEmpty" class="subtle" hidden>No matching names found.</p>
        </div>


        <div id="emptyState" class="empty-state" hidden>
          <p>No leaderboard data yet.</p>
          <p class="subtle">Ask your admin to update your rankings.</p>
        </div>

        <!-- Leaderboard table -->
        <div class="table-wrap" id="leaderboardWrap">
          <table class="leaderboard">
            <thead>
              <tr id="leaderboardHead"></tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
