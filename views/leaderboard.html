<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ROLE_TITLE}} Leaderboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="leaderboard" data-role="{{ROLE_SLUG}}">
    <!-- Sticky header with logo -->
    <header class="page-header leaderboard-header">
      <div class="logo-wrap">
        <img src="/logo.png" alt="Client logo" class="logo" />
      </div>
      <div class="header-text">
        <h1>{{ROLE_TITLE}}</h1>
      </div>
    </header>

    <!-- Main leaderboard card -->
    <main class="page">
      <section class="card">
        <div class="card-header">
          <div>
            <h2>Leaderboard</h2>
            <p class="subtle">Updated: <span id="lastUpdated">--</span></p>
          </div>
          <span class="pill">{{ROLE_TAG}}</span>
        </div>

        <div class="leaderboard-tools">
          <label class="search-field">
            <span class="sr-only">Search employee name</span>
            <input id="leaderboardSearch" type="search" placeholder="Search employee name" />
          </label>
          <p id="searchEmpty" class="subtle" hidden>No matching names found.</p>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          <p>No leaderboard data yet.</p>
          <p class="subtle">Ask you admin to update your rankings.</p>
        </div>

        <!-- Leaderboard table -->
        <div class="table-wrap" id="leaderboardWrap">
          <table class="leaderboard">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Employee Name</th>
                <th>Score</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/script.js"></script>
  </body>
</html>
